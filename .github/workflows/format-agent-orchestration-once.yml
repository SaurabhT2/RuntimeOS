name: Format orchestration package once

on:
  push:
    branches:
      - feature/saurabh-ai-dynamic-orchestrator
    paths:
      - .github/workflows/format-agent-orchestration-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saurabh-ai-dynamic-orchestrator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/agent-orchestration packages/agent-registry/src/builtins/index.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git add packages/agent-orchestration packages/agent-registry/src/builtins/index.ts
          git commit -m "Format orchestration plan and registry files"
          git push origin HEAD:feature/saurabh-ai-dynamic-orchestrator
